<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=https://qccodec.docs.afh.org/" />
    <link rel="canonical" href="https://qccodec.docs.afh.org/" />
    <script>
      // Keep the path, query and fragment so old deep links land on the same page.
      window.location.replace(
        "https://qccodec.docs.afh.org" + window.location.pathname + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body>
    <p>The qccodec documentation has moved to <a href="https://qccodec.docs.afh.org/">qccodec.docs.afh.org</a>.</p>
  </body>
</html>
